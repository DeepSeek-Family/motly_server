<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Health Check - Mahsundic API</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: #f5f7fa;
            min-height: 100vh;
            padding: 40px 20px;
        }

        .container {
            background: white;
            padding: 40px;
            border-radius: 8px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.08);
            max-width: 900px;
            margin: 0 auto;
        }

        .header {
            margin-bottom: 30px;
            padding-bottom: 20px;
            border-bottom: 2px solid #e2e8f0;
        }

        .header h1 {
            color: #1a202c;
            font-size: 1.8em;
            margin-bottom: 8px;
            font-weight: 600;
        }

        .header p {
            color: #718096;
            font-size: 0.95em;
        }

        .status-badge {
            background: #10b981;
            color: white;
            padding: 14px 20px;
            border-radius: 6px;
            margin: 25px 0;
            font-weight: 500;
            font-size: 1em;
            display: inline-flex;
            align-items: center;
            gap: 8px;
        }

        .status-icon {
            width: 8px;
            height: 8px;
            background: white;
            border-radius: 50%;
        }

        .services-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 16px;
            margin: 25px 0;
        }

        .service-card {
            background: #f8fafc;
            padding: 20px;
            border-radius: 6px;
            border-left: 3px solid #10b981;
            border: 1px solid #e2e8f0;
        }

        .service-card h3 {
            color: #1a202c;
            font-size: 1em;
            margin-bottom: 8px;
            font-weight: 500;
        }

        .service-status {
            color: #10b981;
            font-weight: 500;
            font-size: 0.9em;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .service-status::before {
            content: "●";
            font-size: 0.8em;
        }

        .info-section {
            background: #f8fafc;
            padding: 20px;
            border-radius: 6px;
            margin: 25px 0;
            border: 1px solid #e2e8f0;
        }

        .info-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
            gap: 20px;
        }

        .info-item {
            display: flex;
            flex-direction: column;
        }

        .info-label {
            color: #718096;
            font-size: 0.85em;
            margin-bottom: 4px;
        }

        .info-value {
            color: #1a202c;
            font-size: 1.1em;
            font-weight: 500;
        }

        .back-link {
            display: inline-block;
            color: #3b82f6;
            text-decoration: none;
            margin-top: 25px;
            font-size: 0.95em;
        }

        .back-link:hover {
            text-decoration: underline;
        }

        .back-link::before {
            content: "← ";
        }

        @media (max-width: 768px) {
            .container {
                padding: 30px 20px;
            }

            .header h1 {
                font-size: 2em;
            }

            .services-grid {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>Health Check</h1>
            <p>System status and monitoring</p>
        </div>
        
        <div class="status-badge">
            <span class="status-icon"></span>
            <span>All Systems Operational</span>
        </div>

        <div class="services-grid">
            <div class="service-card">
                <h3>API Server</h3>
                <div class="service-status">Running</div>
            </div>

            <div class="service-card">
                <h3>Database</h3>
                <div class="service-status">Connected</div>
            </div>

            <div class="service-card">
                <h3>Redis Cache</h3>
                <div class="service-status">Connected</div>
            </div>

            <div class="service-card">
                <h3>Stripe</h3>
                <div class="service-status">Active</div>
            </div>
        </div>

        <div class="info-section">
            <div class="info-grid">
                <div class="info-item">
                    <span class="info-label">Last Checked</span>
                    <span class="info-value" id="time"></span>
                </div>
                <div class="info-item">
                    <span class="info-label">Server Uptime</span>
                    <span class="info-value">99.9%</span>
                </div>
                <div class="info-item">
                    <span class="info-label">Response Time</span>
                    <span class="info-value">&lt; 50ms</span>
                </div>
                <div class="info-item">
                    <span class="info-label">Status</span>
                    <span class="info-value" style="color: #10b981;">Healthy</span>
                </div>
            </div>
        </div>

        <a href="/" class="back-link">Back to Home</a>
    </div>

    <script>
        function updateTime() {
            const now = new Date();
            document.getElementById('time').textContent = now.toLocaleString('en-US', {
                month: 'short',
                day: 'numeric',
                year: 'numeric',
                hour: '2-digit',
                minute: '2-digit',
                second: '2-digit'
            });
        }
        updateTime();
        setInterval(updateTime, 1000);
    </script>
</body>
</html>
